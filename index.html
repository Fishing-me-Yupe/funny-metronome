<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像メトロノーム</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
        }

        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }

        .metronome-display {
            width: 240px;
            height: 280px;
            margin: 20px auto;
            position: relative;
            background: rgba(0, 0, 0, 0.03);
            border-bottom: 8px solid #444;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        /* 振り子 */
        .pendulum {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 120px;
            height: 240px;
            margin-left: -60px;
            transform-origin: bottom center;
            transform: rotate(0deg);
            transition: transform 0.1s linear;
        }

        /* 画像＋光影ラッパー */
        .img-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* 写真本体 */
        .pendulum img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 
           画像の形（アルファ値）に完璧に切り抜く光影オーバーレイ
           mask-imageを利用して透過PNGの形に完全にフィットさせます
        */
        .photo-light-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.1s linear;
            
            /* 初期値：角度0度のライティング */
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.7) 0%,
                rgba(255, 255, 255, 0) 45%,
                rgba(0, 0, 0, 0) 55%,
                rgba(0, 0, 0, 0.6) 100%
            );
            mix-blend-mode: overlay;
            
            /* 画像の輪郭でマスク（くり抜き） */
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: bottom center;
            mask-position: bottom center;
        }

        /* エフェクトON時 */
        .pendulum.effect-on .photo-light-overlay {
            opacity: 1;
        }

        /* コントロール群 */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .bpm-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            font-size: 1.1rem;
            text-align: center;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        button {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        button:hover { background-color: #0056b3; }
        button.playing { background-color: #dc3545; }
        button.playing:hover { background-color: #a71d2a; }

        .file-input {
            font-size: 0.85rem;
            max-width: 180px;
        }

        /* スイッチ */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #007bff; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

<div class="container">
    <h2>画像メトロノーム</h2>

    <div class="metronome-display">
        <div class="pendulum" id="pendulum">
            <div class="img-container">
                <img id="pendulumImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='200'><rect width='8' height='180' x='46' y='20' fill='%23333'/><circle cx='50' cy='60' r='18' fill='%23d9534f'/></svg>" alt="振り子">
                <div class="photo-light-overlay" id="lightOverlay"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="imgUpload">画像を選択:</label>
            <input type="file" id="imgUpload" accept="image/*" class="file-input">
        </div>

        <div class="control-group">
            <label for="bgColorPicker">背景色:</label>
            <input type="color" id="bgColorPicker" value="#f0f0f0">
        </div>

        <div class="control-group">
            <label for="effectToggle">流動的な光・影 (画像の形状に密着):</label>
            <label class="switch">
                <input type="checkbox" id="effectToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="bpm-control">
            <label for="bpm">BPM:</label>
            <input type="number" id="bpm" value="120" min="30" max="250">
            <input type="range" id="bpmRange" value="120" min="30" max="250">
        </div>

        <button id="startBtn">スタート</button>
    </div>
</div>

<script>
    let audioCtx = null;

    function playClick() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
    }

    const startBtn = document.getElementById('startBtn');
    const bpmInput = document.getElementById('bpm');
    const bpmRange = document.getElementById('bpmRange');
    const pendulum = document.getElementById('pendulum');
    const imgUpload = document.getElementById('imgUpload');
    const pendulumImg = document.getElementById('pendulumImg');
    const lightOverlay = document.getElementById('lightOverlay');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const effectToggle = document.getElementById('effectToggle');

    let isPlaying = false;
    let timerId = null;
    let direction = 1;
    const swingAngle = 30;

    // マスク画像を更新して、画像の輪郭部分だけに切り抜く関数
    function updateMaskImage(src) {
        lightOverlay.style.webkitMaskImage = `url("${src}")`;
        lightOverlay.style.maskImage = `url("${src}")`;
    }

    // 初期画像のマスク適用
    updateMaskImage(pendulumImg.src);

    bpmInput.addEventListener('input', (e) => bpmRange.value = e.target.value);
    bpmRange.addEventListener('input', (e) => bpmInput.value = e.target.value);

    bgColorPicker.addEventListener('input', (e) => {
        document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    effectToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
            pendulum.classList.add('effect-on');
        } else {
            pendulum.classList.remove('effect-on');
        }
    });

    imgUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const imgData = event.target.result;
                pendulumImg.src = imgData;
                updateMaskImage(imgData); // アップロード画像に合わせてマスク切り抜き更新
            };
            reader.readAsDataURL(file);
        }
    });

    function tick() {
        playClick();

        const currentAngle = direction * swingAngle;
        const bpm = parseInt(bpmInput.value, 10);
        const intervalMs = (60 / bpm) * 1000;
        const durationSec = intervalMs / 1000;

        // 振れる動き
        pendulum.style.transition = `transform ${durationSec}s ease-in-out`;
        pendulum.style.transform = `rotate(${currentAngle}deg)`;

        /* 
           【角度に応じて流動的に光と影の位置（グラデーション角度）を変える】
           右に振れるとき・左に振れるときで光の当たり方がリアルタイム変化します
        */
        const gradientAngle = 135 - (currentAngle * 1.5); 
        lightOverlay.style.transition = `background ${durationSec}s ease-in-out`;
        lightOverlay.style.background = `linear-gradient(
            ${gradientAngle}deg,
            rgba(255, 255, 255, 0.75) 0%,
            rgba(255, 255, 255, 0) 40%,
            rgba(0, 0, 0, 0) 60%,
            rgba(0, 0, 0, 0.65) 100%
        )`;

        direction *= -1;
        timerId = setTimeout(tick, intervalMs);
    }

    startBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            isPlaying = true;
            startBtn.textContent = 'ストップ';
            startBtn.classList.add('playing');
            tick();
        } else {
            isPlaying = false;
            startBtn.textContent = 'スタート';
            startBtn.classList.remove('playing');
            clearTimeout(timerId);
            
            pendulum.style.transition = 'transform 0.5s ease';
            pendulum.style.transform = 'rotate(0deg)';
            
            // 光の位置も初期に戻す
            lightOverlay.style.transition = 'background 0.5s ease';
            lightOverlay.style.background = `linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.65) 100%)`;
            
            direction = 1;
        }
    });
</script>

</body>
</html>
