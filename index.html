<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像メトロノーム</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
        }

        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        /* メトロノームの表示エリア */
        .metronome-display {
            width: 200px;
            height: 250px;
            margin: 20px auto;
            position: relative;
            background: rgba(0, 0, 0, 0.05);
            border-bottom: 8px solid #555;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        /* 振り子（画像）を配置する要素 */
        .pendulum {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 90px;        /* 画像の幅 */
            height: 220px;      /* 振り子の高さ */
            margin-left: -45px; /* 幅の半分だけ左にずらして中央合わせ */
            
            /* 回転の軸を下部中央に設定 */
            transform-origin: bottom center;
            transform: rotate(0deg);
            
            /* 滑らかな動きのためのCSSトランジション */
            transition: transform 0.1s linear;
        }

        /* 振り子の画像ラッパー */
        .img-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .pendulum img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* 基本的な影（本体の影） */
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));
            transition: filter 0.3s ease;
        }

        /* 光の反射・グラデーションオーバーレイ */
        .light-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 画像のクリック等を邪魔しない */
            opacity: 0;
            transition: opacity 0.3s ease;
            
            /* 斜めの光ハイライトと影のグラデーション */
            background: linear-gradient(
                135deg, 
                rgba(255, 255, 255, 0.6) 0%, 
                rgba(255, 255, 255, 0.1) 40%, 
                rgba(0, 0, 0, 0.15) 70%, 
                rgba(0, 0, 0, 0.4) 100%
            );
            /* 画像の形に合わせて光を切り抜く設定 */
            mix-blend-mode: overlay;
        }

        /* 3D効果モード ON 時のスタイル */
        .pendulum.effect-on .light-effect {
            opacity: 1;
        }

        .pendulum.effect-on img {
            /* 影を濃くして立体感を高める */
            filter: drop-shadow(5px 10px 8px rgba(0, 0, 0, 0.5));
        }

        /* コントロールエリア */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .bpm-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            font-size: 1.1rem;
            text-align: center;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        button {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button.playing {
            background-color: #dc3545;
        }

        button.playing:hover {
            background-color: #a71d2a;
        }

        .file-input {
            font-size: 0.85rem;
            max-width: 200px;
        }

        /* トグルスイッチの見た目 */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #007bff;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>画像メトロノーム</h2>

    <!-- メトロノーム画面 -->
    <div class="metronome-display">
        <div class="pendulum" id="pendulum">
            <div class="img-wrapper">
                <!-- 初期画像（メトロノーム針のSVG） -->
                <img id="pendulumImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='200'><rect width='8' height='180' x='46' y='20' fill='%23333'/><circle cx='50' cy='60' r='18' fill='%23d9534f'/></svg>" alt="メトロノームの針">
                <!-- 光と影のエフェクト層 -->
                <div class="light-effect"></div>
            </div>
        </div>
    </div>

    <!-- コントロール群 -->
    <div class="controls">
        <!-- 画像アップロード -->
        <div class="control-group">
            <label for="imgUpload">好きな画像:</label>
            <input type="file" id="imgUpload" accept="image/*" class="file-input">
        </div>

        <!-- 背景色選択 -->
        <div class="control-group">
            <label for="bgColorPicker">背景色:</label>
            <input type="color" id="bgColorPicker" value="#f0f0f0">
        </div>

        <!-- 3D・光と影モード -->
        <div class="control-group">
            <label for="effectToggle">光・影エフェクト (立体感):</label>
            <label class="switch">
                <input type="checkbox" id="effectToggle">
                <span class="slider"></span>
            </label>
        </div>

        <!-- BPM設定 -->
        <div class="bpm-control">
            <label for="bpm">BPM:</label>
            <input type="number" id="bpm" value="120" min="30" max="250">
            <input type="range" id="bpmRange" value="120" min="30" max="250">
        </div>

        <!-- スタート/ストップボタン -->
        <button id="startBtn">スタート</button>
    </div>
</div>

<script>
    // Web Audio API の初期化（クリック音用）
    let audioCtx = null;

    function playClick() {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle'; 
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime); 
        
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
    }

    // 要素の取得
    const startBtn = document.getElementById('startBtn');
    const bpmInput = document.getElementById('bpm');
    const bpmRange = document.getElementById('bpmRange');
    const pendulum = document.getElementById('pendulum');
    const imgUpload = document.getElementById('imgUpload');
    const pendulumImg = document.getElementById('pendulumImg');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const effectToggle = document.getElementById('effectToggle');

    let isPlaying = false;
    let timerId = null;
    let direction = 1; // 1: 右, -1: 左
    const swingAngle = 30; // 傾く角度

    // BPMの入力連動
    bpmInput.addEventListener('input', (e) => bpmRange.value = e.target.value);
    bpmRange.addEventListener('input', (e) => bpmInput.value = e.target.value);

    // 背景色の変更
    bgColorPicker.addEventListener('input', (e) => {
        document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    // 光・影エフェクトの切替
    effectToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
            pendulum.classList.add('effect-on');
        } else {
            pendulum.classList.remove('effect-on');
        }
    });

    // 画像ファイルの読み込み
    imgUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                pendulumImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // メトロノームの1拍分の処理
    function tick() {
        // 音を鳴らす
        playClick();

        // 左右に回転
        const currentAngle = direction * swingAngle;
        
        // 移動にかかる時間を計算してCSSにセット
        const bpm = parseInt(bpmInput.value, 10);
        const intervalMs = (60 / bpm) * 1000;
        pendulum.style.transition = `transform ${intervalMs / 1000}s ease-in-out`;
        pendulum.style.transform = `rotate(${currentAngle}deg)`;

        // 向きを反転
        direction *= -1;

        // 次のタイマーをセット
        timerId = setTimeout(tick, intervalMs);
    }

    // スタート / ストップの切り替え
    startBtn.addEventListener('click', () => {
        if (!isPlaying) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            isPlaying = true;
            startBtn.textContent = 'ストップ';
            startBtn.classList.add('playing');
            
            tick();
        } else {
            isPlaying = false;
            startBtn.textContent = 'スタート';
            startBtn.classList.remove('playing');
            
            clearTimeout(timerId);
            pendulum.style.transition = 'transform 0.5s ease';
            pendulum.style.transform = 'rotate(0deg)';
            direction = 1;
        }
    });
</script>

</body>
</html>
